<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blackjack - Login</title>
    <style>
        body { background-color: #0a1f12; color: white; font-family: sans-serif; text-align: center; padding-top: 80px; margin: 0; }
        .box { max-width: 350px; margin: auto; background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 12px; border: 1px solid #d4af37; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; font-size: 16px; }
        .btn { width: 95%; background: #2ed573; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #26af5f; }
        a { color: #d4af37; text-decoration: none; }
        .error { color: #ff4757; font-weight: bold; }
    </style>
</head>
<body>
    <img src="/static/images/wesley_logo.png" style="position: absolute; top: 20px; left: 20px; width: 100px; height: auto;" alt="Logo">
    <div class="box">
        <h1>♠️Wesley Collage♣️<br>6A 16 ICT SBA<br>BlackJack</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit" class="btn">Login</button>
        </form>
        
        <div style="margin-top: 12px;">
            <button type="button" onclick="alert('please contact admin')" style="background: none; border: none; color: #d4af37; cursor: pointer; font-size: 14px; text-decoration: underline;">
                Forget Password
            </button>
        </div>

        <p style="margin-top: 15px;">Don't have an account? <a href="/register">Register here</a></p>
    </div>
    <footer style="margin-top: 50px; padding: 20px 0; border-top: 1px solid #333; text-align: center; color: #888; font-size: 14px;">
        <p style="margin: 5px 0;">Minors are strictly prohibited from participating in gambling activities.</p>
        <p style="margin: 5px 0; color: #aaa; font-weight: bold;">*Just For School SBA - No Real Money Gambling Included*</p>
    </footer>
</body>
</html>
