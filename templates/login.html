<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blackjack - Login</title>
    <style>
        body {
            background-color: #0a1f12;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 320px;
            text-align: center;
            border: 2px solid #d4af37;
        }
        h2 {
            color: #1b4332;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #333333;
            font-size: 14px;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background-color: #b71c1c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-register {
            width: 100%;
            background-color: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <img src="/static/images/wesley_logo.png" style="position: absolute; top: 20px; left: 20px; width: 60px; height: auto;">

    <div class="login-card">
        <h2>♠️Weasley Collage♣️<br>6A 16 ICT SBA<br>Blackjack</h2>
        <form action="/login" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-submit">Play Now</button>
            <a href="/register" class="btn-register">Register Account</a>
        </form>
        <div style="margin-top: 20px; font-size: 11px; color: #888;">
            <p>Minors strictly prohibited from gambling activities.</p>
            <p style="color: #aaa; font-weight: bold;">*Just For School SBA - No Real Money Gambling*</p>
        </div>
    </div>
</body>
</html>
