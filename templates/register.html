<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家註冊 - 衛理中學 ICT BlackJack</title>
    <!-- 我們可以直接借用 login.html 的樣式，讓外觀統一 -->
    <style>
        /* 這裡貼上你之前的 CSS 樣式，或者之後我們學如何用外部 CSS 連結 */
        body { background-color: #0a1f12; font-family: "Microsoft JhengHei", sans-serif; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-card { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); width: 350px; text-align: center; }
        h2 { color: #d4af37; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #ccc; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: rgba(0, 0, 0, 0.3); color: white; box-sizing: border-box; }
        .btn-confirm { width: 100%; padding: 16px; background: #d4af37; color: black; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-back { width: 100%; padding: 12px; background: transparent; color: #888; border: 1px solid #444; border-radius: 10px; font-size: 14px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>📝 申請入會</h2>
        <!-- 注意：這裡我們暫時先發送到 /login 來模擬註冊後的動作 -->
        <form action="/do_register" method="POST">
            <div class="input-group">
                <label>設定新帳號</label>
                <input type="text" name="username" placeholder="請輸入欲使用的暱稱" required>
            </div>
            <div class="input-group">
                <label>設定密碼</label>
                <input type="password" name="password" placeholder="請設定 6 位以上密碼" required>
            </div>
            <button type="submit" class="btn-confirm">確認註冊並開局</button>
            <button type="button" class="btn-back" onclick="window.location.href='/'">返回登入頁面</button>
        </form>
    </div>
</body>
</html>
